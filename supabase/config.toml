project_id = "shuicetong-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://127.0.0.1:4173/**", "http://localhost:4173/**"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "64MiB"

# 超时单位：秒。取值依据各函数内部已设置的最大依赖耗时之和：
# agent-chat = 15s 检索 + 25s 模型（含一次重试）+ 持久化余量
# enterprise-file-upload = 服务端下载 20MB 原文件复核 + SHA-256
# delete-* = 递归 Storage 清点 + 级联删除
[functions.complete-assessment]
verify_jwt = true
timeout = 30

[functions.knowledge-search]
verify_jwt = true
timeout = 20

[functions.knowledge-source-url]
verify_jwt = true
timeout = 15

[functions.agent-chat]
verify_jwt = true
timeout = 90

[functions.delete-enterprise]
verify_jwt = true
timeout = 90

[functions.enterprise-file-upload]
verify_jwt = true
timeout = 60

[functions.delete-enterprise-file]
verify_jwt = true
timeout = 60
